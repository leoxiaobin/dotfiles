# ─── General ─────────────────────────────────────────────────────────

# Timezone
set-environment -g TZ "America/Los_Angeles"

# Prefix: C-q (C-b conflicts with Vim)
set -g prefix C-q
bind C-q last-window
bind q send-prefix

# Indexing
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Timing
set -s escape-time 0
set -g repeat-time 600
set -g display-time 1500

# Behavior
set -g history-limit 50000
set -g focus-events on
setw -g aggressive-resize on
setw -g monitor-activity on
set -g visual-activity off
setw -g automatic-rename on

# Mouse
set -g mouse on

# ─── Display ─────────────────────────────────────────────────────────

set -g default-terminal "tmux-256color"
set -ag terminal-features ",*256col*:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ─── Status Bar ──────────────────────────────────────────────────────

set -g status-position top
set -g status-interval 5
set -g status-justify left

# ─── Colors (non-theme) ─────────────────────────────────────────────

set -g display-panes-active-colour "#946A3A"
set -g display-panes-colour "#51453E"
set -g display-panes-time 2000
setw -g clock-mode-colour "#946A3A"

# ─── Key Bindings ────────────────────────────────────────────────────

# Splits (preserve current path)
bind v split-window -h -c "#{pane_current_path}"
bind b split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Windows (preserve current path)
bind c new-window -c "#{pane_current_path}"
bind C command-prompt -p "Name of new window: " "new-window -n '%%' -c '#{pane_current_path}'"

# Floating scratch session for quick temporary commands
bind T display-popup -E -w 90% -h 80% "env -u TMUX sh -lc 'tmux new-session -d -s temp 2>/dev/null || true; tmux set-option -t temp status off; tmux set-option -t temp pane-border-status off; tmux attach-session -t temp'"

# On WSL/Windows Terminal, keep Ctrl-v for editor visual-block mode but stop
# Copilot/readline-style CLIs from hanging on literal Ctrl-v input.
if-shell 'uname -r | grep -qi microsoft' \
  'bind-key -n C-v if-shell -F "#{m/r:^(nvim|vim|emacs|emacsclient)$,#{pane_current_command}}" "send-keys C-v" "display-message \"Ctrl-v blocked here; use Ctrl-Shift-v to paste\""'

# Pane navigation (hjkl)
bind h select-pane -L \; display-message "Pane #{pane_index}: #{pane_current_command}"
bind j select-pane -D \; display-message "Pane #{pane_index}: #{pane_current_command}"
bind k select-pane -U \; display-message "Pane #{pane_index}: #{pane_current_command}"
bind l select-pane -R \; display-message "Pane #{pane_index}: #{pane_current_command}"

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Send PageUp/PageDown to apps (repeatable — hold C-q then tap u/d)
bind -r C-u send-keys PageUp
bind -r C-d send-keys PageDown

# Layouts
bind m run-shell "~/.tmux/scripts/resize-adaptable.sh -l main-horizontal -p 66"
bind M run-shell "~/.tmux/scripts/resize-adaptable.sh -l main-vertical -p 50"

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# ─── Copy Mode ───────────────────────────────────────────────────────

setw -g mode-keys vi

# Vi-style copy bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# OSC 52 clipboard (works over SSH and in most modern terminals)
set -s set-clipboard on

# ─── Plugins (TPM) ───────────────────────────────────────────────────

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ─── Resurrect / Continuum ───────────────────────────────────────────

# Restore vim/nvim sessions, top, htop (not AI CLIs — those need fresh starts)
set -g @resurrect-processes 'vim nvim top htop less man'

# Save/restore pane contents (off — keeps save files small and fast)
set -g @resurrect-capture-pane-contents 'off'

# Continuum: auto-save every 15 minutes
set -g @continuum-save-interval '15'

# Continuum: auto-restore last saved session on tmux start
# Enable after first save exists (~/.tmux/resurrect/last)
if-shell '[ -f ~/.tmux/resurrect/last ]' \
  "set -g @continuum-restore 'on'" \
  "set -g @continuum-restore 'off'"

# Initialize TPM (keep near the bottom)
run '~/.tmux/plugins/tpm/tpm'

# ─── Post-Plugin Overrides ──────────────────────────────────────────

# MAI warm-paper status theme (must be after TPM loads).
# Matches the Windows Terminal "Microsoft AI Warm Paper" palette.
set -g status-style "fg=#1F1412,bg=#D8C8A8"
set -g status-left "#[fg=#FBF0DC,bg=#1F1412,bold] #S #[fg=#1F1412,bg=#D8C8A8] #{b:pane_current_path} "
set -g status-left-length 100
set -g status-right "#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#[fg=#946A3A,bg=#D8C8A8]  #(~/.tmux/custom/git_status.sh #{pane_current_path}) #[fg=#1F1412,bg=#D8C8A8] #{pane_current_command} #[fg=#FBF0DC,bg=#1F1412,bold] %Y-%m-%d %H:%M "
set -g status-right-length 150
setw -g window-status-style "fg=#51453E,bg=#D8C8A8"
setw -g window-status-current-style "fg=#FBF0DC,bg=#1F1412,bold"
setw -g window-status-format " #I:#W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-format " #I:#W#{?window_zoomed_flag, 󰊓,} "
set -g message-style "fg=#1F1412,bg=#D8C8A8,align=centre"
setw -g mode-style "fg=#FBF0DC,bg=#946A3A,bold"

# Floating popup border (must be after TPM loads)
set -g popup-border-style "fg=#946A3A,bold"
set -g popup-border-lines rounded

# Make the active pane obvious when many panes are open.
# Keep this after TPM loads so plugins cannot overwrite it.
setw -g pane-border-lines heavy
setw -g pane-border-style "fg=#51453E"
setw -g pane-active-border-style "fg=#946A3A,bold"
setw -g pane-border-status top
setw -g pane-border-format "#{?pane_active,#[fg=#FBF0DC,bg=#1F1412,bold] ACTIVE #P #{pane_current_command} #[default],#[fg=#51453E] #P #{pane_current_command} #[default]}"
