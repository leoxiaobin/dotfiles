# 素 (Su) · lsd 色彩映射
# 浅色背景优化：避免缃色/赭石在大片文字中难读
# 改用深色系（墨、青花、竹青）作主色，暖色只做点缀
# 使用 ANSI 256 色号而非颜色名，对应 Su 16 色调色板

user: 15               # ANSI 15 = 墨 #38342C（前景色，最清晰）
group: 2               # ANSI 2 = 竹青（内容/数据）

permission:
  read: 2              # 竹青（读取=内容）
  write: 1             # 朱砂（写入=重要）
  exec: 1              # 朱砂（执行=特殊权限）
  exec-sticky: 5       # 黛紫（粘滞=更特殊）
  no-access: 8         # 墨痕（无权限=淡化）

size:
  none: 8              # 墨痕
  small: 2             # 竹青
  medium: 15           # 墨色（中等文件，高对比）
  large: 4             # 青花（大文件醒目但不刺眼）

date:
  hour-old: 2          # 竹青（新鲜）
  day-old: 4           # 青花（近期，更清晰）
  older: 6             # 天青（久远）

inode:
  valid: 4             # 青花（结构）
  invalid: 8           # 墨痕

links:
  valid: 6             # 天青（链接，清晰可读）
  invalid: 8           # 墨痕
