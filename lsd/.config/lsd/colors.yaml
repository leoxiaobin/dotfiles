# 素 (Su) · lsd 色彩映射
#
# lsd 只接受 ANSI 色号，而 ANSI 0-15 由终端的 Su 调色板定义
# (ghostty/.config/ghostty/config.ghostty)，所以这里写的是语义到色号的
# 映射，真正的色值仍然来自 theme/colors.toml。
#
# 3 = 缃色 #6a5d12  4 = 青花 #295f8a  15 = 墨 #38342c
# 在 #f3eee1 的浅底上缃色只有 5.69:1，墨色有 10.69:1，所以每行都出现的
# user 和数量最多的 size.medium 用墨色，暖色只做点缀。

user: 15               # 墨 — 每行都出现，用最高对比
group: 7
permission:
  read: 2
  write: 3
  exec: 1
  exec-sticky: 5
  no-access: 8
  octal: 6
  acl: 14
  context: 7
date:
  hour-old: 6
  day-old: 6
  older: 4
size:
  none: 8
  small: 2
  medium: 15           # 墨 — 中等文件最常见
  large: 1
inode:
  valid: 5
  invalid: 8
links:
  valid: 13
  invalid: 8
tree-edge: 8
git-status:
  default: 7
  unmodified: 8
  ignored: 8
  new-in-index: 2
  new-in-workdir: 2
  typechange: 3
  deleted: 1
  renamed: 4
  modified: 3
  conflicted: 1
