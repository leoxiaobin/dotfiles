"$schema" = 'https://starship.rs/config-schema.json'
palette = "su"

[palettes.su]
# 素 (Su) · 传统色调色板
su_bg = "#f3eee1"       # 宣纸
su_ink = "#38342c"      # 墨
su_muted = "#5f584c"    # 墨痕
su_accent = "#6a5d12"   # 缃色（function/调用）
su_red = "#8c1234"      # 朱砂（error）
su_green = "#3f6428"    # 竹青（string/内容）
su_yellow = "#8f3c22"   # 赭石（number）
su_blue = "#295f8a"     # 青花（keyword）
su_purple = "#5a4685"   # 黛紫（builtin）
su_cyan = "#236b5c"     # 天青（type）
su_field = "#84394f"    # 胭脂（field）

